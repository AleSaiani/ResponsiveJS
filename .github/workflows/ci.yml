name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Only the packages that are actually published. `pnpm -r exec publint`
      # also ran inside the root, the example and the site — all private, none
      # with a `version` — where the packer fails with "Invalid package, must
      # have name and version", surfacing as an unhelpful "Failed to find packed
      # tarball file in /tmp/publint-pack-…".
      - name: publint (publishable packages only)
        shell: bash
        run: |
          for dir in packages/*/; do
            if node -e "process.exit(require('./${dir}package.json').private ? 1 : 0)"; then
              echo "── $dir"
              npx publint "$dir" --pack npm
            fi
          done

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the landing fixture and the inject/devtool e2e run against built dist
      - run: pnpm build
      - run: pnpm --filter @responsivejs/design exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  site:
    name: site (built with r$, verified by r$)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter responsivejs-site build:site
      - run: pnpm --filter @responsivejs/design exec playwright install --with-deps chromium
      # the badge in the footer is this step passing
      - run: |
          npx --yes http-server site/.vitepress/dist -p 4173 --silent &
          npx wait-on http://127.0.0.1:4173 -t 30000
          node packages/cli/dist/bin.js verify site/site.contract.json http://127.0.0.1:4173/ -d playwright
