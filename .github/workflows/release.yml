name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # No-op on forks; npm publish requires the NPM_TOKEN secret to be configured.
    if: github.repository == 'AleSaiani/ResponsiveJS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Who is publishing, and what may they publish? An EOTP failure looks the
      # same whether the token is stale, scoped elsewhere, or blocked by a 2FA
      # policy — this separates those cases before the publish burns a run.
      # It prints a username and package names; never the token.
      - name: Identify the publishing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or missing"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "npm version: $(npm --version)"
          echo "authenticated as: $(npm whoami)"
          echo "--- what this token can write in the scope ---"
          npm access list packages @responsivejs || echo "(no packages in the scope yet — expected before the first publish)"
          echo "--- 2FA mode reported for the account ---"
          npm profile get 2>&1 | grep -i "two-factor" || echo "(not reported)"

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance only in CI (needs OIDC); local/Verdaccio publishes stay clean.
          NPM_CONFIG_PROVENANCE: 'true'

      # In prerelease mode changesets publishes under the `alpha` dist-tag, and a
      # package that has never been published has no `latest` at all — so a plain
      # `npm i @responsivejs/runtime` would resolve to nothing. We ship
      # 1.0.0-alpha.0 as the version people get by default, so point `latest` at
      # what was just published. (`changeset publish --tag latest` is refused in
      # pre mode, hence doing it here.) Idempotent: re-pointing is a no-op.
      - name: Point latest at the published prerelease
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          node -e '
            for (const { name, version } of JSON.parse(process.env.PUBLISHED)) {
                console.log(`${name}@${version}`);
            }
          ' | while read -r spec; do
            echo "dist-tag add $spec latest"
            npm dist-tag add "$spec" latest
          done
